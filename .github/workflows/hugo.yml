name: Build and publish

# 推送到 main 就自动构建，并把产物推到 gh-pages（GitHub Pages 的发布分支）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Decide base URL
        id: base
        run: |
          if [ -f static/CNAME ]; then
            echo "url=https://$(head -1 static/CNAME | tr -d '[:space:]')/" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://hehehe1234567894.github.io/Blog/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.base.outputs.url }}"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "publish: ${{ github.event.head_commit.message }}"

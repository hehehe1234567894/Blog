{{- /* 背景光斑（纯 CSS 动画，不依赖 JS） */ -}}
<div id="bg-blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="home-typing" aria-hidden="true"><span class="t-text"></span><span class="t-caret"></span></div>
<div id="cc-veil" class="out" aria-hidden="true"></div>
{{- with resources.Get "img/kanban-girl.png" }}
  {{- $g := .Resize "300x webp q80" }}
<img id="cc-girl" src="{{ $g.RelPermalink }}" alt="看板娘" draggable="false">
<div id="cc-girl-bubble" aria-hidden="true"></div>
{{- end }}
<div id="scroll-ring" aria-hidden="true">
  <svg viewBox="0 0 46 46" width="46" height="46">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#22d3ee"/>
        <stop offset="1" stop-color="#a78bfa"/>
      </linearGradient>
    </defs>
    <circle class="ring-bg" cx="23" cy="23" r="20"/>
    <circle class="ring-fg" cx="23" cy="23" r="20" stroke-dasharray="125.6" stroke-dashoffset="125.6"/>
  </svg>
  <span class="ring-arrow">↑</span>
</div>
{{- /* 主题扩展：二次元风动态背景（花瓣 + 星点）＋ 阅读进度 ＋ 滚动渐显 ＋ 图片放大 ＋ 目录高亮 */ -}}
<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var themeDark = function () {
    var t = document.documentElement.dataset.theme;
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  };

  /* ---------- 1. 背景粒子场 + MIEW 粒子文字（参考 DeepSeek 官网 / MiMo 官网的粒子风） ---------- */
  var canvas = document.createElement('canvas');
  canvas.id = 'bg-canvas';
  document.body.insertBefore(canvas, document.body.firstChild);
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = 0, H = 0, raf = null, tick = 0;
  var isHome = !!document.querySelector('.home-info');
  var fine = window.matchMedia('(pointer: fine)').matches;
  var field = [], tparts = [], targets = [], burst = 0;
  var pointer = { x: -9999, y: -9999, active: false };

  function themeInk() {
    return themeDark()
      ? { field: '190,225,255', text: ['125,211,252', '167,139,250', '226,244,255'] }
      : { field: '90,110,200', text: ['99,102,241', '139,92,246', '59,130,246'] };
  }

  /* 从离屏画布采样 "MIEW" 的字形点 */
  function makeTargets() {
    var ow = 720, oh = 240, gap = 6;
    var off = document.createElement('canvas');
    off.width = ow; off.height = oh;
    var o = off.getContext('2d');
    o.fillStyle = '#fff';
    o.font = '700 156px system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif';
    o.textAlign = 'center';
    o.textBaseline = 'middle';
    o.fillText('MIEW', ow / 2, oh / 2 + 6);
    var d = o.getImageData(0, 0, ow, oh).data;
    var pts = [];
    for (var y = 0; y < oh; y += gap) {
      for (var x = 0; x < ow; x += gap) {
        if (d[(y * ow + x) * 4 + 3] > 128) pts.push([x / ow, y / oh]);
      }
    }
    return pts;
  }

  function resize() {
    W = canvas.width = Math.floor(window.innerWidth * dpr);
    H = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';

    // 环境粒子（有深度感）
    var n = Math.round(Math.min(110, Math.max(36, window.innerWidth * window.innerHeight / 16000)));
    field = [];
    for (var i = 0; i < n; i++) {
      var z = Math.random() * 0.8 + 0.2;
      field.push({
        x: Math.random() * W, y: Math.random() * H, z: z,
        r: (0.5 + z * 1.4) * dpr,
        vx: (Math.random() - .5) * .34 * dpr * z,
        vy: (Math.random() - .5) * .34 * dpr * z,
        ph: Math.random() * 6.283
      });
    }

    // MIEW 粒子文字（窄屏直接留空，避免糊一屏）
    if (W < 860 * dpr) { tparts = []; targets = []; return; }
    var pts = makeTargets();
    var wide = W >= 860 * dpr;
    var textW = Math.min(W * 0.30, 420 * dpr);
    var textH = textW * 0.333;
    var cx = wide ? W * 0.72 : W * 0.5;
    var cy = wide ? H * 0.19 : H * 0.14;
    tparts = [];
    for (var k = 0; k < pts.length; k++) {
      var p = pts[k];
      var tx = cx + (p[0] - 0.5) * textW;
      var ty = cy + (p[1] - 0.5) * textH;
      tparts.push({
        x: Math.random() * W, y: Math.random() * H, tx: tx, ty: ty,
        vx: 0, vy: 0, r: (Math.random() * 0.7 + 1.0) * dpr,
        ph: Math.random() * 6.283,
        c: Math.floor(Math.random() * 3)
      });
    }
    targets = tparts;
    // 便于排查：把粒子数量写进 body 属性（不影响显示）
    try { document.body.setAttribute('data-bg-particles', field.length + '/' + tparts.length); } catch (e) {}
  }

  function scatter() {
    for (var i = 0; i < tparts.length; i++) {
      var p = tparts[i];
      p.x = Math.random() * W;
      p.y = Math.random() * H;
    }
  }

  /* 初始状态：贴着目标位置稍微散开一点，这样第一帧就能看出是 MIEW，
     再随着动画聚拢（避免动画被打断时只剩一堆乱点） */
  function prime() {
    for (var i = 0; i < tparts.length; i++) {
      var p = tparts[i];
      p.x = p.tx + (Math.random() - 0.5) * 8 * dpr;
      p.y = p.ty + (Math.random() - 0.5) * 8 * dpr;
    }
  }

  function draw() {
    var ink = themeInk();
    ctx.clearRect(0, 0, W, H);
    tick += 0.016;
    var dark = themeDark();

    // ① 环境粒子：缓慢漂移 + 近距离连线
    for (var i = 0; i < field.length; i++) {
      var a = field[i];
      if (!reduce) {
        a.x += a.vx + Math.sin(tick * 0.4 + a.ph) * 0.05 * dpr;
        a.y += a.vy + Math.cos(tick * 0.35 + a.ph) * 0.05 * dpr;
      }
      if (pointer.active) {
        // 被鼠标轻轻吸引（参考码格模板的做法），靠太近时再轻轻推开一点
        var dx = pointer.x - a.x, dy = pointer.y - a.y;
        var R = 190 * dpr, d2 = dx * dx + dy * dy;
        if (d2 < R * R && d2 > 1) {
          var d = Math.sqrt(d2), t2 = 1 - d / R;
          var pull = t2 * t2 * 0.55;
          a.x += (dx / d) * pull; a.y += (dy / d) * pull;
          if (d < 46 * dpr) { a.x -= (dx / d) * 1.1; a.y -= (dy / d) * 1.1; }
        }
      }
      if (a.x < -30) a.x = W + 30; else if (a.x > W + 30) a.x = -30;
      if (a.y < -30) a.y = H + 30; else if (a.y > H + 30) a.y = -30;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, 6.28318);
      ctx.fillStyle = 'rgba(' + ink.field + ',' + (dark ? 0.30 : 0.22) * a.z + ')';
      ctx.fill();
    }
    // 先画“鼠标—粒子”的连线，形成星座感
    if (pointer.active) {
      var linkR = 190 * dpr;
      for (var li = 0; li < field.length; li++) {
        var lp = field[li];
        var ldx = lp.x - pointer.x, ldy = lp.y - pointer.y;
        var ld = Math.sqrt(ldx * ldx + ldy * ldy);
        if (ld < linkR) {
          ctx.strokeStyle = 'rgba(' + ink.field + ',' + (0.30 * (1 - ld / linkR)).toFixed(3) + ')';
          ctx.lineWidth = 0.9 * dpr;
          ctx.beginPath(); ctx.moveTo(lp.x, lp.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
        }
      }
    }
    var maxD = 130 * dpr;
    for (var m = 0; m < field.length; m++) {
      var p1 = field[m];
      for (var q = m + 1; q < field.length; q++) {
        var p2 = field[q];
        if (p1.z < 0.55 || p2.z < 0.55) continue;
        var ddx = p1.x - p2.x, ddy = p1.y - p2.y, dd = ddx * ddx + ddy * ddy;
        if (dd < maxD * maxD) {
          var dd2 = Math.sqrt(dd);
          ctx.strokeStyle = 'rgba(' + ink.field + ',' + (0.10 * (1 - dd2 / maxD)).toFixed(3) + ')';
          ctx.lineWidth = 0.7 * dpr;
          ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        }
      }
    }

    // ② MIEW 粒子文字：聚拢 → 保持 → 鼠标拨开 / 滚动散开
    var dissolved = window.scrollY > 140 || burst > 0;
    for (var t = 0; t < tparts.length; t++) {
      var tp = tparts[t];
      var tx = tp.tx, ty = tp.ty;
      if (dissolved) {
        tx = tp.x + Math.sin(tick * 0.5 + tp.ph) * 30 * dpr;
        ty = tp.y + Math.cos(tick * 0.45 + tp.ph) * 30 * dpr;
      }
      var ease = reduce ? 1 : (dissolved ? 0.012 : 0.055);
      tp.x += (tx - tp.x) * ease;
      tp.y += (ty - tp.y) * ease;
      if (!dissolved) {
        tp.x += Math.sin(tick * 0.9 + tp.ph) * 0.18 * dpr;
        tp.y += Math.cos(tick * 0.8 + tp.ph) * 0.18 * dpr;
      }
      if (pointer.active) {
        var tdx = tp.x - pointer.x, tdy = tp.y - pointer.y, td2 = tdx * tdx + tdy * tdy;
        var TR = 130 * dpr;
        if (td2 < TR * TR && td2 > 1) {
          var td = Math.sqrt(td2), tf = (1 - td / TR) * 6.0;
          tp.x += (tdx / td) * tf; tp.y += (tdy / td) * tf;
        }
      }
      var near = Math.abs(tp.x - tp.tx) + Math.abs(tp.y - tp.ty);
      var alpha = dissolved ? 0.14 : Math.max(0.12, 0.46 - near / (300 * dpr));
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, tp.r, 0, 6.28318);
      ctx.fillStyle = 'rgba(' + ink.text[tp.c] + ',' + alpha.toFixed(3) + ')';
      ctx.fill();
    }
    if (burst > 0) burst -= 1;
  }

  function loop() { draw(); raf = requestAnimationFrame(loop); }
  resize();
  prime();
  if (reduce) { draw(); } else { loop(); }

  if (!reduce && fine) {
    window.addEventListener('pointermove', function (e) {
      pointer.x = e.clientX * dpr; pointer.y = e.clientY * dpr; pointer.active = true;
    }, { passive: true });
    window.addEventListener('pointerleave', function () { pointer.active = false; });
    // 点一下，粒子炸开再回来（一点点互动）
    window.addEventListener('pointerdown', function (e) {
      if (e.target.closest('a, button, input')) return;
      burst = 40; scatter();
    });
  }

  window.addEventListener('resize', function () { resize(); if (reduce) draw(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
    else if (!reduce && !raf) { loop(); }
  });
  new MutationObserver(function () { if (reduce) draw(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* ---------- 2. 顶部阅读进度条（只在文章页） ---------- */
  if (document.querySelector('.post-single')) {
    var bar = document.createElement('div');
    bar.id = 'reading-progress';
    document.body.appendChild(bar);
    var onScroll = function () {
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      bar.style.transform = 'scaleX(' + Math.min(1, Math.max(0, max > 0 ? h.scrollTop / max : 0)) + ')';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  /* ---------- 3. 导航栏滚动状态 ---------- */
  var header = document.querySelector('.header');
  if (header) {
    var mark = function () { header.classList.toggle('is-scrolled', window.scrollY > 12); };
    window.addEventListener('scroll', mark, { passive: true });
    mark();
  }

  /* ---------- 4. 列表浮现交给 CSS 的 stagger 动画（见 custom.css），这里不再用 JS 控制 */

  /* ---------- 5. 文章图片点击放大 ---------- */
  var imgs = document.querySelectorAll('.post-content img');
  if (imgs.length) {
    var box = null;
    var close = function () {
      if (!box) return;
      var b = box; box = null;
      b.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(function () { b.remove(); }, 200);
    };
    imgs.forEach(function (img) {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function () {
        box = document.createElement('div');
        box.className = 'lightbox';
        var big = document.createElement('img');
        big.src = img.currentSrc || img.src;
        big.alt = img.alt || '';
        box.appendChild(big);
        box.addEventListener('click', close);
        document.body.appendChild(box);
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(function () { box.classList.add('open'); });
      });
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  }

  /* ---------- 6. 目录高亮当前小节 ---------- */
  var toc = document.getElementById('TableOfContents');
  if (toc && 'IntersectionObserver' in window) {
    var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
    var map = {}, heads = [];
    links.forEach(function (a) {
      var id = decodeURIComponent(a.getAttribute('href').slice(1));
      var h = document.getElementById(id);
      if (h) { map[id] = a; heads.push(h); }
    });
    if (heads.length) {
      var tio = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          links.forEach(function (a) { a.classList.remove('active'); });
          var a = map[en.target.id];
          if (a) a.classList.add('active');
        });
      }, { rootMargin: '-72px 0px -70% 0px', threshold: 0 });
      heads.forEach(function (h) { tio.observe(h); });
    }
  }
  /* ---------- 7. 卡片跟随鼠标的柔光 ---------- */
  if (window.matchMedia('(pointer: fine)').matches) {
    document.querySelectorAll('.post-entry, .first-entry').forEach(function (card) {
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    });
  }

  /* ---------- 8. 鼠标跟光 ---------- */
  var glow = document.createElement('div');
  glow.id = 'cursor-glow';
  document.body.appendChild(glow);
  if (!reduce && window.matchMedia('(pointer: fine)').matches) {
    var gx = 0, gy = 0, tx = 0, ty = 0, glue = false, moved = false;
    var loopGlow = function () {
      gx += (tx - gx) * 0.14;
      gy += (ty - gy) * 0.14;
      glow.style.transform = 'translate3d(' + gx.toFixed(1) + 'px,' + gy.toFixed(1) + 'px,0)';
      if (Math.abs(tx - gx) > 0.6 || Math.abs(ty - gy) > 0.6) { requestAnimationFrame(loopGlow); }
      else { glue = false; }
    };
    document.addEventListener('pointermove', function (e) {
      tx = e.clientX; ty = e.clientY;
      if (!moved) { gx = tx; gy = ty; moved = true; }
      glow.classList.add('on');
      if (!glue) { glue = true; requestAnimationFrame(loopGlow); }
    }, { passive: true });
    document.addEventListener('pointerleave', function () { glow.classList.remove('on'); });
  }

  /* ---------- 9. 光斑随滚动视差 ---------- */
  var blobs = document.getElementById('bg-blobs');
  if (blobs && !reduce) {
    var lastY = -1;
    window.addEventListener('scroll', function () {
      var y = window.scrollY;
      if (y === lastY) return;
      lastY = y;
      blobs.style.transform = 'translate3d(0,' + (-y * 0.07).toFixed(1) + 'px,0)';
    }, { passive: true });
  }

  /* ---------- 10. 首页：头像旋转环 + 循环打字机 ---------- */
  var homeInfo = document.querySelector('.home-info');
  if (homeInfo) {
    var header = homeInfo.querySelector('.entry-header');
    var typingBox = document.getElementById('home-typing');
    if (typingBox && header) {
      header.parentNode.insertBefore(typingBox, header.nextSibling);
      typingBox.classList.add('show');
      var lines = ['写 C 语言，也焊板子', '折腾单片机与硬件', '记录每一条踩过的坑'];
      var tText = typingBox.querySelector('.t-text');
      if (reduce) {
        tText.textContent = lines[0];
      } else {
        var li = 0, ci = 0, deleting = false;
        var step = function () {
          var cur = lines[li];
          var chars = Array.from(cur);
          ci += deleting ? -1 : 1;
          tText.textContent = chars.slice(0, ci).join('');
          var wait = deleting ? 38 : 82;
          if (!deleting && ci >= chars.length) { deleting = true; wait = 1700; }
          else if (deleting && ci <= 0) { deleting = false; li = (li + 1) % lines.length; wait = 320; }
          setTimeout(step, wait);
        };
        setTimeout(step, 500);
      }
    }
  }

  /* ---------- 11. 环形进度 + 点击回顶部 ---------- */
  var ring = document.getElementById('scroll-ring');
  if (ring) {
    var fg = ring.querySelector('.ring-fg');
    var ringUpdate = function () {
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      var p = max > 0 ? Math.min(1, Math.max(0, h.scrollTop / max)) : 0;
      fg.setAttribute('stroke-dashoffset', (125.6 * (1 - p)).toFixed(1));
      if (h.scrollTop > 240) { ring.classList.add('show'); } else { ring.classList.remove('show'); }
    };
    window.addEventListener('scroll', ringUpdate, { passive: true });
    ringUpdate();
    ring.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });
  }

  /* ---------- 12. 自定义光标：点 + 拖尾的环 ---------- */
  if (fine && !reduce) {
    document.documentElement.classList.add('cursor-custom');
    var cdot = document.createElement('div'); cdot.id = 'cursor-dot';
    var cring = document.createElement('div'); cring.id = 'cursor-ring';
    document.body.appendChild(cdot); document.body.appendChild(cring);
    var mx = -100, my = -100, rx = -100, ry = -100, cStarted = false, cGoing = false;
    var cLoop = function () {
      rx += (mx - rx) * 0.16; ry += (my - ry) * 0.16;
      cring.style.transform = 'translate3d(' + rx.toFixed(1) + 'px,' + ry.toFixed(1) + 'px,0)';
      if (Math.abs(mx - rx) > 0.4 || Math.abs(my - ry) > 0.4) { requestAnimationFrame(cLoop); }
      else { cGoing = false; }
    };
    var onMove = function (e) {
      mx = e.clientX; my = e.clientY;
      cdot.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0)';
      if (!cStarted) { rx = mx; ry = my; cStarted = true; cdot.classList.add('on'); cring.classList.add('on'); }
      if (!cGoing) { cGoing = true; requestAnimationFrame(cLoop); }
    };
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('mousemove', onMove, { passive: true });
    document.addEventListener('pointerover', function (e) {
      var hot = e.target.closest ? e.target.closest('a, button, .post-entry, .post-tags a, #scroll-ring, .logo a, summary') : null;
      cring.classList.toggle('hot', !!hot);
      cdot.classList.toggle('hot', !!hot);
    });
    document.addEventListener('pointerleave', function () { cdot.classList.remove('on'); cring.classList.remove('on'); });
    // 兜底：如果一直没收到指针事件（某些环境 pointer 事件不可用），就把自定义光标收掉，
    // 也不要去动系统光标，免得用户干脆看不到鼠标
    setTimeout(function () {
      if (!cStarted) {
        cdot.remove(); cring.remove();
        document.documentElement.classList.remove('cursor-custom');
      }
    }, 2000);
  }

  /* ---------- 13. 「这份主题」的招牌交互 ---------- */
  var fine2 = window.matchMedia('(pointer: fine)').matches;

  /* ① 页面切换帘子：点站内链接先盖上再走 */
  var veil = document.getElementById('cc-veil');
  if (veil && !reduce) {
    document.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a') : null;
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (!href || href.charAt(0) === '#' || a.target === '_blank') return;
      if (a.host && a.host !== location.host) return;
      e.preventDefault();
      veil.classList.remove('out');
      setTimeout(function () { location.href = a.href; }, 260);
    });
    window.addEventListener('pageshow', function () { requestAnimationFrame(function () { veil.classList.add('out'); }); });
  }

  /* ② 看板娘：点一下冒句台词 */
  var girl = document.getElementById('cc-girl');
  var bubble = document.getElementById('cc-girl-bubble');
  if (girl && bubble) {
    var talks = ['今天也要写代码呀～', 'C 语言作业交了没？', '记得 git push！', '有问题就点文章下面留言～', '摸鱼一时爽，一直摸鱼一直爽'];
    var ti = 0, bt = null;
    girl.addEventListener('click', function () {
      bubble.textContent = talks[ti % talks.length];
      ti++;
      bubble.classList.add('show');
      clearTimeout(bt);
      bt = setTimeout(function () { bubble.classList.remove('show'); }, 3200);
    });
  }

  /* ③ 文章小标题滑入时出渐变竖条 */
  var heads = document.querySelectorAll('.post-content h2, .post-content h3');
  if (heads.length && 'IntersectionObserver' in window) {
    var hio = new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        en.target.classList.toggle('cc-head-in', en.isIntersecting);
        if (en.isIntersecting) en.target.classList.add('cc-head');
      });
    }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });
    heads.forEach(function (h) { h.classList.add('cc-head'); hio.observe(h); });
  }

  /* ④ 图片渐显 */
  document.querySelectorAll('.post-content img').forEach(function (im) {
    im.classList.add('cc-img-fade');
    if (im.complete) { im.classList.add('cc-in'); }
    else { im.addEventListener('load', function () { im.classList.add('cc-in'); }); im.addEventListener('error', function () { im.classList.add('cc-in'); }); }
  });

  /* ⑤ 首页：套上 hero + 三张数据卡 */
  var info = document.querySelector('.home-info');
  if (info) {
    info.classList.add('cc-home-hero');
    var title = info.querySelector('.entry-header h1');
    if (title) title.classList.add('cc-hero-title');
    var content = info.querySelector('.entry-content');
    if (content) content.classList.add('cc-sub');
    var c = window.__CC_COUNTS;
    if (c && !info.querySelector('.cc-bento')) {
      var rows = [['posts', '篇文章'], ['tags', '个标签'], ['cats', '个分类']];
      var box = document.createElement('div');
      box.className = 'cc-bento';
      rows.forEach(function (r) {
        var card = document.createElement('div');
        card.className = 'cc-bento-card';
        var num = document.createElement('span');
        num.className = 'cc-bento-num';
        num.textContent = c[r[0]] || 0;
        var lab = document.createElement('span');
        lab.className = 'cc-bento-label';
        lab.textContent = r[1];
        card.appendChild(num); card.appendChild(lab); box.appendChild(card);
      });
      var host = info.querySelector('.entry-footer') || content || info;
      host.parentNode.insertBefore(box, host.nextSibling);
    }
  }

  /* ⑥ 粉色花瓣（这一份主题的樱花效果，淡一点） */
  if (!reduce) {
    var pc = document.createElement('canvas');
    pc.id = 'cc-sakura';
    document.body.insertBefore(pc, document.body.firstChild);
    var px2 = pc.getContext('2d');
    var pw = 0, ph = 0, petals = [], praf = null, ptick = 0;
    var preset = function () {
      pw = pc.width = window.innerWidth; ph = pc.height = window.innerHeight;
      var n = Math.min(22, Math.floor(pw / 60));
      petals = [];
      for (var i = 0; i < n; i++) {
        petals.push({
          x: Math.random() * pw, y: Math.random() * ph,
          r: Math.random() * 5 + 4, vy: Math.random() * .35 + .25,
          ph2: Math.random() * 6.283, rot: Math.random() * 6.283,
          vr: (Math.random() - .5) * .02, a: Math.random() * .18 + .12
        });
      }
    };
    var petalPath = function (x, y, r, rot) {
      px2.save(); px2.translate(x, y); px2.rotate(rot);
      px2.beginPath(); px2.moveTo(0, -r);
      px2.bezierCurveTo(r * .95, -r * .55, r * .8, r * .6, 0, r);
      px2.bezierCurveTo(-r * .8, r * .6, -r * .95, -r * .55, 0, -r);
      px2.closePath(); px2.fill(); px2.restore();
    };
    var pdraw = function () {
      ptick += .016;
      px2.clearRect(0, 0, pw, ph);
      for (var i = 0; i < petals.length; i++) {
        var p = petals[i];
        p.y += p.vy;
        p.x += Math.sin(ptick * .8 + p.ph2) * .45;
        p.rot += p.vr;
        if (p.y - p.r > ph) { p.y = -p.r * 2; p.x = Math.random() * pw; }
        px2.globalAlpha = p.a;
        px2.fillStyle = '#f9a8d4';
        petalPath(p.x, p.y, p.r, p.rot);
        px2.globalAlpha = 1;
      }
    };
    var ploop = function () { pdraw(); praf = requestAnimationFrame(ploop); };
    preset();
    ploop();
    window.addEventListener('resize', preset);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { if (praf) { cancelAnimationFrame(praf); praf = null; } }
      else if (!praf) { ploop(); }
    });
  }
})();
</script>

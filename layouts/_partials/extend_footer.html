{{- /* 主题扩展：少量前端动效（滚动渐显 / 阅读进度 / 导航栏状态） */ -}}
<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var header = document.querySelector('.header');

  // 顶部阅读进度条（只在文章页）
  if (document.querySelector('.post-single')) {
    var bar = document.createElement('div');
    bar.id = 'reading-progress';
    document.body.appendChild(bar);
    var onScroll = function () {
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      var p = max > 0 ? h.scrollTop / max : 0;
      bar.style.transform = 'scaleX(' + Math.min(1, Math.max(0, p)) + ')';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // 导航栏滚动状态
  if (header) {
    var mark = function () {
      header.classList.toggle('is-scrolled', window.scrollY > 12);
    };
    window.addEventListener('scroll', mark, { passive: true });
    mark();
  }

  // 列表卡片滚动渐显（带一点点错峰）
  var items = document.querySelectorAll('.post-entry, .first-entry');
  if (reduce || !('IntersectionObserver' in window)) return;
  items.forEach(function (el, i) {
    el.classList.add('reveal');
    el.style.transitionDelay = Math.min(i, 5) * 60 + 'ms';
  });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        e.target.classList.add('is-visible');
        io.unobserve(e.target);
      }
    });
  }, { rootMargin: '0px 0px 0px 0px', threshold: 0.01 });
  items.forEach(function (el) { io.observe(el); });
  // 兜底 1：已经在视口里的立刻显示（首屏不该等）
  items.forEach(function (el) {
    var r = el.getBoundingClientRect();
    if (r.top < window.innerHeight && r.bottom > 0) el.classList.add('is-visible');
  });
  // 兜底 2：观察器万一没触发（截图工具、老浏览器），2.5 秒后全部显示
  setTimeout(function () {
    items.forEach(function (el) { el.classList.add('is-visible'); });
  }, 2500);
})();
</script>

<script>
(function () {
  // 图片点击放大（自己写的轻量 lightbox，不引第三方库）
  var imgs = document.querySelectorAll('.post-content img');
  if (imgs.length) {
    var box = null;
    var close = function () {
      if (!box) return;
      var b = box;
      box = null;
      b.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(function () { b.remove(); }, 200);
    };
    imgs.forEach(function (img) {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function () {
        box = document.createElement('div');
        box.className = 'lightbox';
        var big = document.createElement('img');
        big.src = img.currentSrc || img.src;
        big.alt = img.alt || '';
        box.appendChild(big);
        box.addEventListener('click', close);
        document.body.appendChild(box);
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(function () { box.classList.add('open'); });
      });
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  }

  // 目录里高亮当前读到的小节
  var toc = document.getElementById('TableOfContents');
  if (toc && 'IntersectionObserver' in window) {
    var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
    var map = {}, heads = [];
    links.forEach(function (a) {
      var id = decodeURIComponent(a.getAttribute('href').slice(1));
      var h = document.getElementById(id);
      if (h) { map[id] = a; heads.push(h); }
    });
    if (heads.length) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          links.forEach(function (a) { a.classList.remove('active'); });
          var a = map[en.target.id];
          if (a) a.classList.add('active');
        });
      }, { rootMargin: '-72px 0px -70% 0px', threshold: 0 });
      heads.forEach(function (h) { io.observe(h); });
    }
  }
})();
</script>

<script>
(function () {
  // 动态背景：三块缓慢漂移的光斑 + 淡淡的颗粒连线
  if (!document.getElementById('bg-blobs')) {
    var blobs = document.createElement('div');
    blobs.id = 'bg-blobs';
    blobs.innerHTML = '<i></i><i></i><i></i>';
    document.body.insertBefore(blobs, document.body.firstChild);
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.createElement('canvas');
  canvas.id = 'bg-canvas';
  document.body.insertBefore(canvas, document.body.firstChild);
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = 0, H = 0, parts = [], raf = null;

  function palette() {
    var dark = document.documentElement.dataset.theme === 'dark' ||
      (!document.documentElement.dataset.theme &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
    return dark ? '125,211,252,' : '14,116,144,';
  }

  function resize() {
    W = canvas.width = Math.floor(window.innerWidth * dpr);
    H = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    var n = Math.round(Math.min(70, Math.max(22, window.innerWidth * window.innerHeight / 34000)));
    parts = [];
    for (var i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .18 * dpr,
        vy: (Math.random() - .5) * .18 * dpr,
        r: (Math.random() * 1.1 + .5) * dpr
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var col = palette(), maxD = 130 * dpr;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (!reduce) { p.x += p.vx; p.y += p.vy; }
      if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.28318);
      ctx.fillStyle = 'rgba(' + col + '0.5)';
      ctx.fill();
      for (var j = i + 1; j < parts.length; j++) {
        var q = parts[j], dx = p.x - q.x, dy = p.y - q.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d < maxD) {
          ctx.strokeStyle = 'rgba(' + col + (0.15 * (1 - d / maxD)).toFixed(3) + ')';
          ctx.lineWidth = 0.7 * dpr;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }
  }

  function loop() { draw(); raf = requestAnimationFrame(loop); }

  resize();
  if (reduce) { draw(); } else { loop(); }

  window.addEventListener('resize', function () { resize(); if (reduce) draw(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
    else if (!reduce && !raf) { loop(); }
  });
  new MutationObserver(function () { if (reduce) draw(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
